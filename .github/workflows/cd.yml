name: CD - Auth Lambda

on:
  push:
    branches: [hml, prod]

  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options:
          - hml
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: auth-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Auth Lambda
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}

    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}

      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET || 'car-repair-k8s-infra-terraform-state' }}

      TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      TF_VAR_project_name: car-repair-auth-lambda

      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_database_client_security_group_id: ${{ vars.DATABASE_CLIENT_SECURITY_GROUP_ID }}

      TF_VAR_database_secret_arn: ${{ vars.DATABASE_SECRET_ARN }}
      TF_VAR_database_secret_name: ${{ vars.DATABASE_SECRET_NAME }}

      TF_VAR_jwt_secret_name: ${{ vars.JWT_SECRET_NAME }}
      TF_VAR_jwt_issuer: ${{ vars.JWT_ISSUER || 'car-repair-auth' }}
      TF_VAR_jwt_audience: ${{ vars.JWT_AUDIENCE || 'car-repair-shop' }}
      TF_VAR_jwt_expiration_in_minutes: ${{ vars.JWT_EXPIRATION_IN_MINUTES || '60' }}

      TF_VAR_db_schema: ${{ vars.DB_SCHEMA || 'public' }}
      TF_VAR_customers_table_name: ${{ vars.CUSTOMERS_TABLE_NAME || 'Users' }}

      TF_VAR_enable_api_gateway: ${{ vars.ENABLE_API_GATEWAY || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target
        shell: bash
        run: |
          test "${TARGET_ENV}" = "hml" || test "${TARGET_ENV}" = "prod"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CarRepair.Auth.Lambda.sln

      - name: Build
        run: |
          dotnet build \
            CarRepair.Auth.Lambda.sln \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test \
            CarRepair.Auth.Lambda.sln \
            --configuration Release \
            --no-build

      - name: Publish Lambda
        run: |
          dotnet publish \
            src/Lambda/CarRepair.Auth.Lambda.csproj \
            --configuration Release \
            --output artifacts/publish

      - name: Package Lambda
        shell: bash
        run: |
          cd artifacts/publish
          zip -r ../lambda.zip .
          mkdir -p ../../terraform/artifacts
          cp ../lambda.zip ../../terraform/artifacts/lambda.zip

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=car-repair-auth-lambda/${TARGET_ENV}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="lambda_package_path=./artifacts/lambda.zip"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
